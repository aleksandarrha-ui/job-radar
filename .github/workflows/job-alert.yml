# Copy this file's content into: .github/workflows/job-alert.yml  (see SETUP.md, step 5)
name: Job alert

on:
  schedule:
    - cron: "0 5,17 * * *"   # every 12 hours (05:00 and 17:00 UTC = 06:00/18:00 German winter time)
  workflow_dispatch:          # lets you start it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: job-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect jobs, send email, rebuild dashboard
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scraper.py
      - name: Save state and dashboard
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "Update jobs" && git push)
